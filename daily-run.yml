```yaml
name: Update Pakistan Time

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-time:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install timezone dependency
        run: pip install tzdata

      - name: Generate PKT time SVG
        run: python generate_time_svg.py

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/assets/pkt-time.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Pakistan time"
            git push
          fi
```
